[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amstack"
version = "0.1.0"
description = "Generate and maintain the Ambhora Spack package repository"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
amstack = "amstack.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/amstack"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
